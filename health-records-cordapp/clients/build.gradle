apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web:$spring_boot_version"
    implementation "org.springframework.boot:spring-boot-starter-actuator:$spring_boot_version"
    
    implementation "$corda_release_group:corda-rpc:$corda_release_version"
    implementation "$corda_core_release_group:corda-core:$corda_core_release_version"
    
    implementation project(":contracts")
    implementation project(":workflows")
    
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
}

springBoot {
    mainClass = 'com.healthrecords.webserver.Starter'
}

task runHospitalServer(type: JavaExec, dependsOn: assemble) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.healthrecords.webserver.Starter'
    args '--server.port=50005',
         '--config.rpc.host=localhost',
         '--config.rpc.port=10006',
         '--config.rpc.username=user1',
         '--config.rpc.password=test'
}

task runDoctorServer(type: JavaExec, dependsOn: assemble) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.healthrecords.webserver.Starter'
    args '--server.port=50006',
         '--config.rpc.host=localhost',
         '--config.rpc.port=10009',
         '--config.rpc.username=user1',
         '--config.rpc.password=test'
}
